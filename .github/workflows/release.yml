name: Publish Nemo

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg_sha256: ${{ steps.artifact.outputs.dmg_sha256 || steps.existing.outputs.dmg_sha256 }}
      arch: ${{ steps.artifact.outputs.arch || steps.existing.outputs.arch }}
    steps:
      - name: Check out Nemo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: nemo-gui
          persist-credentials: false
      - name: Read release version and runtime revision
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "runtime_ref=$(cat nemo-gui/Scripts/nemo-c-revision)" >> "$GITHUB_OUTPUT"
      - name: Reuse an already published release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          assets="$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for name in "Nemo-$version.dmg" "Nemo-$version.zip" "Nemo-$version.sha256"; do
            grep -Fxq "$name" <<< "$assets" || { echo "Existing release is missing $name" >&2; exit 1; }
          done
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern "Nemo-$version.sha256" --dir "$RUNNER_TEMP"
          checksum="$(awk -v name="Nemo-$version.dmg" '$2 == name { print $1 }' "$RUNNER_TEMP/Nemo-$version.sha256")"
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]] || { echo "Existing release has an invalid DMG checksum" >&2; exit 1; }
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$checksum" >> "$GITHUB_OUTPUT"
          echo "arch=arm64" >> "$GITHUB_OUTPUT"
      - name: Check out speech runtime
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SeungheonOh/nemo-c
          ref: ${{ steps.version.outputs.runtime_ref }}
          path: nemoasr-c
          persist-credentials: false
      - name: Install Developer ID signing and notarization credentials
        if: steps.existing.outputs.exists != 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$CERTIFICATE_BASE64" "$CERTIFICATE_PASSWORD" "$NOTARY_KEY_BASE64" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID"; do
            [[ -n "$value" ]] || { echo "Missing Apple release secret" >&2; exit 1; }
          done
          umask 077
          certificate="$RUNNER_TEMP/nemo-developer-id.p12"
          keychain="$RUNNER_TEMP/nemo-signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo "Developer ID Application identity not found" >&2; exit 1; }
          echo "CODESIGN_ID=$identity" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_FILE=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Fetch pinned speech model
        if: steps.existing.outputs.exists != 'true'
        working-directory: nemo-gui
        run: Scripts/fetch-model.sh build/model-source
      - name: Build signed and notarized release
        if: steps.existing.outputs.exists != 'true'
        working-directory: nemo-gui
        env:
          MODEL_DIR: build/model-source
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: Scripts/release.sh "${{ steps.version.outputs.version }}"
      - name: Verify release artifacts
        if: steps.existing.outputs.exists != 'true'
        id: artifact
        working-directory: nemo-gui
        shell: bash
        run: |
          set -euo pipefail
          app=build/Nemo.app
          dmg="dist/Nemo-${{ steps.version.outputs.version }}.dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          echo "dmg_sha256=$(shasum -a 256 "$dmg" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          arches="$(lipo -archs "$app/Contents/MacOS/NemoDictate")"
          case "$arches" in
            arm64) arch=arm64 ;;
            "arm64 x86_64"|"x86_64 arm64") arch=universal ;;
            *) echo "Unsupported app architecture: $arches" >&2; exit 1 ;;
          esac
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        working-directory: nemo-gui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" "dist/Nemo-$version.dmg" "dist/Nemo-$version.zip" "dist/Nemo-$version.sha256" --verify-tag --title "Nemo $version" --generate-notes

  publish-cask:
    needs: package
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out cask generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: nemo-gui
          persist-credentials: false
      - name: Check out Homebrew tap from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: tap
          persist-credentials: true
      - name: Render and audit cask
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.package.outputs.version }}"
          curl --fail --location --head --retry 5 --retry-delay 5 "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/Nemo-$version.dmg" > /dev/null
          mkdir -p tap/Casks
          nemo-gui/Scripts/render-cask.sh "$version" "${{ needs.package.outputs.dmg_sha256 }}" "${{ needs.package.outputs.arch }}" > "$RUNNER_TEMP/nemo.rb"
          if [[ -f tap/Casks/nemo.rb ]]; then
            current="$(sed -n 's/^  version "\([^"]*\)"/\1/p' tap/Casks/nemo.rb | head -1)"
            if [[ "$current" == "$version" ]]; then
              cmp -s tap/Casks/nemo.rb "$RUNNER_TEMP/nemo.rb" || { echo "Version $version already has different cask metadata" >&2; exit 1; }
            else
              ruby -rrubygems -e 'exit(Gem::Version.new(ARGV[0]) < Gem::Version.new(ARGV[1]) ? 0 : 1)' "$current" "$version" || { echo "Tap already has a newer version" >&2; exit 1; }
            fi
          fi
          cp "$RUNNER_TEMP/nemo.rb" tap/Casks/nemo.rb
          ruby -c tap/Casks/nemo.rb
          audit_tap="$(brew --repository)/Library/Taps/nemo-ci/homebrew-nemo-qa"
          mkdir -p "$audit_tap/Casks"
          git -C "$audit_tap" init -q -b main
          cp tap/Casks/nemo.rb "$audit_tap/Casks/nemo.rb"
          brew audit --cask nemo-ci/nemo-qa/nemo
          brew untap --force nemo-ci/nemo-qa
      - name: Commit cask update
        shell: bash
        run: |
          set -euo pipefail
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Casks/nemo.rb
          if git -C tap diff --cached --quiet; then
            echo "Cask is already current"
            exit 0
          fi
          git -C tap commit -m "Update Nemo to v${{ needs.package.outputs.version }}"
          git -C tap push origin HEAD:main
